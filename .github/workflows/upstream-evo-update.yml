name: Add SC Evo patch link

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-evo-update
  cancel-in-progress: false

jobs:
  add-patch-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect the next official update and add an empty Patch.csv block
        id: discover
        run: node scripts/discover-upstream-update.mjs Patch.csv

      - name: Commit and push the new version link
        if: steps.discover.outputs.update_found == 'true'
        env:
          VERSION: ${{ steps.discover.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Patch.csv
          git commit -m "Add SC: Evo $VERSION patch link"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report status
        if: always()
        env:
          UPDATE_FOUND: ${{ steps.discover.outputs.update_found }}
          VERSION: ${{ steps.discover.outputs.version }}
          SOURCE_URL: ${{ steps.discover.outputs.source_url }}
        run: |
          if [[ "$UPDATE_FOUND" == "true" ]]; then
            echo "Added an empty Patch.csv block for $VERSION: $SOURCE_URL"
          else
            echo "No newer official update was found."
          fi
