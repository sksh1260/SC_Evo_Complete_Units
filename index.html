<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=2560">
  <title>SC: Evo Complete - 유닛 스펙 분석기</title>
  <link rel="stylesheet" href="style.css">
  <script>
    /* QHD(2560px) 기준 고정 스케일 — 어떤 해상도에서도 동일하게 보이게 함 */
    (function() {
      var BASE_WIDTH = 2560;
      var BASE_FONT_SIZE = 17.325; /* px, QHD 기준 */
      function applyScale() {
        var w = window.innerWidth || document.documentElement.clientWidth || screen.width;
        var scale = w / BASE_WIDTH;
        document.documentElement.style.fontSize = (BASE_FONT_SIZE * scale) + 'px';
      }
      applyScale();
      window.addEventListener('resize', applyScale);
    })();
  </script>
</head>
<body>

  <!-- 헤더 영역 (검색 & 필터) -->
  <header>
    <div class="control-bar">
      <!-- 좌측 정렬: 종족 탭 그룹 (사이드바 수직 라인과 100% 일치) -->
      <div class="cb-left-group">
        <div class="race-filters">
          <button class="race-btn active" data-race="all"><span>ALL</span></button>
          <button class="race-btn" data-race="bw_terran">
            <img src="Main-icon/BWTerran.png" class="race-tab-icon" alt="테란">
            <div class="race-btn-text">
              <span class="race-btn-prefix">BW</span>
              <span class="race-btn-name">Terran</span>
            </div>
          </button>
          <button class="race-btn" data-race="bw_zerg">
            <img src="Main-icon/BWZerg.png" class="race-tab-icon" alt="저그">
            <div class="race-btn-text">
              <span class="race-btn-prefix">BW</span>
              <span class="race-btn-name">Zerg</span>
            </div>
          </button>
          <button class="race-btn" data-race="bw_protoss">
            <img src="Main-icon/BWProtoss.png" class="race-tab-icon" alt="프로토스">
            <div class="race-btn-text">
              <span class="race-btn-prefix">BW</span>
              <span class="race-btn-name">Protoss</span>
            </div>
          </button>
          <button class="race-btn" data-race="sc2_terran">
            <img src="Main-icon/SC2Terran.png" class="race-tab-icon" alt="스2 테란">
            <div class="race-btn-text">
              <span class="race-btn-prefix">SC2</span>
              <span class="race-btn-name">Terran</span>
            </div>
          </button>
          <button class="race-btn" data-race="sc2_zerg">
            <img src="Main-icon/SC2Zerg.png" class="race-tab-icon" alt="스2 저그">
            <div class="race-btn-text">
              <span class="race-btn-prefix">SC2</span>
              <span class="race-btn-name">Zerg</span>
            </div>
          </button>
          <button class="race-btn" data-race="sc2_protoss">
            <img src="Main-icon/SC2Protoss.png" class="race-tab-icon" alt="스2 프로토스">
            <div class="race-btn-text">
              <span class="race-btn-prefix">SC2</span>
              <span class="race-btn-name">Protoss</span>
            </div>
          </button>
        </div>
      </div>

      <!-- 중앙: 검색창 -->
      <div class="cb-center">
        <div class="search-container">
          <input type="text" id="search-input" class="search-input" placeholder="유닛명, 요구 건물, 특성 등으로 검색...">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
      </div>

      <div class="cb-right">
        <nav class="top-menu" aria-label="주요 메뉴">
          <button type="button" class="top-menu-btn active" data-view="database" aria-current="page">유닛 DB</button>
          <button type="button" class="top-menu-btn" data-view="compare">유닛 비교</button>
          <button type="button" class="top-menu-btn" data-view="patch">패치 내역</button>
        </nav>
      </div>
    </div>
  </header>

  <!-- 메인 콘텐츠 영역 (좌측 세로 필터 사이드바 + 메인 시트 테이블) -->
  <main class="main-layout">

    <!-- 세로 필터 사이드바 (전체, 유닛, 구조물, 능력) -->
    <aside class="left-filter-sidebar">
      <div class="side-sub-filters">
        <div class="sidebar-race-filters">
          <button class="race-btn active" data-race="all"><span>ALL</span></button>
          <button class="race-btn" data-race="bw_terran">
            <img src="Main-icon/BWTerran.png" class="race-tab-icon" alt="테란">
            <div class="race-btn-text"><span class="race-btn-prefix">BW</span><span class="race-btn-name">Terran</span></div>
          </button>
          <button class="race-btn" data-race="bw_zerg">
            <img src="Main-icon/BWZerg.png" class="race-tab-icon" alt="저그">
            <div class="race-btn-text"><span class="race-btn-prefix">BW</span><span class="race-btn-name">Zerg</span></div>
          </button>
          <button class="race-btn" data-race="bw_protoss">
            <img src="Main-icon/BWProtoss.png" class="race-tab-icon" alt="프로토스">
            <div class="race-btn-text"><span class="race-btn-prefix">BW</span><span class="race-btn-name">Protoss</span></div>
          </button>
          <button class="race-btn" data-race="sc2_terran">
            <img src="Main-icon/SC2Terran.png" class="race-tab-icon" alt="SC2 테란">
            <div class="race-btn-text"><span class="race-btn-prefix">SC2</span><span class="race-btn-name">Terran</span></div>
          </button>
          <button class="race-btn" data-race="sc2_zerg">
            <img src="Main-icon/SC2Zerg.png" class="race-tab-icon" alt="SC2 저그">
            <div class="race-btn-text"><span class="race-btn-prefix">SC2</span><span class="race-btn-name">Zerg</span></div>
          </button>
          <button class="race-btn" data-race="sc2_protoss">
            <img src="Main-icon/SC2Protoss.png" class="race-tab-icon" alt="SC2 프로토스">
            <div class="race-btn-text"><span class="race-btn-prefix">SC2</span><span class="race-btn-name">Protoss</span></div>
          </button>
        </div>

        <div class="sidebar-upg-divider"></div>

        <button class="sub-filter-btn side-filter-item active" data-filter="all">전체</button>
        <button class="sub-filter-btn side-filter-item" data-filter="unit">유닛</button>
        <button class="sub-filter-btn side-filter-item" data-filter="structure">구조물</button>

        <div class="sidebar-upg-divider"></div>

        <div class="ability-toggle-side-box side-filter-item" onclick="toggleAbilityRows()" title="능력 서브 행 표시/숨기기">
          <span class="ability-side-lbl">능력</span>
          <button type="button" class="btn-stim-toggle btn-ability-toggle-lg active" id="btn-toggle-ability" title="능력 서브 행 표시/숨기기">
            <span class="toggle-knob"></span>
          </button>
        </div>

        <!-- 약간 간격을 더 준 구분선 및 풀업 / 공업 / 방업 사이드바 컨트롤 -->
        <div class="sidebar-upg-divider"></div>

        <div class="ability-toggle-side-box side-filter-item" onclick="toggleFullUpgrade()" title="전체 풀 업그레이드 적용/해제">
          <span class="ability-side-lbl">풀업</span>
          <button type="button" class="btn-stim-toggle btn-ability-toggle-lg" id="btn-toggle-fullupg" title="전체 풀 업그레이드">
            <span class="toggle-knob"></span>
          </button>
        </div>

        <div class="side-upg-select-box side-filter-item" title="일괄 공격력 업그레이드">
          <span class="ability-side-lbl">공격력</span>
          <select class="sel-sidebar-upg" id="sel-sidebar-atk-upg" onclick="event.stopPropagation();" onchange="setGlobalAtkUpg(this.value)">
            <option value="0">0</option>
            <option value="1">+1</option>
            <option value="2">+2</option>
            <option value="3">+3</option>
          </select>
        </div>

        <div class="side-upg-select-box side-filter-item" title="일괄 방어력 업그레이드">
          <span class="ability-side-lbl">방어력</span>
          <select class="sel-sidebar-upg" id="sel-sidebar-armor-upg" onclick="event.stopPropagation();" onchange="setGlobalArmorUpg(this.value)">
            <option value="0">0</option>
            <option value="1">+1</option>
            <option value="2">+2</option>
            <option value="3">+3</option>
          </select>
        </div>

        <div class="sidebar-upg-divider"></div>

        <button type="button" class="game-speed-toggle" id="btn-game-speed" aria-pressed="true" title="게임 속도 · 아주 빠름 (1.4x)">
          <span class="game-speed-option">1.0x</span>
          <span class="game-speed-option active">1.4x</span>
        </button>

        <div class="sidebar-upg-divider"></div>

        <span class="mode-version sidebar-version" title="현재 모드 버전">v1.20.3</span>
      </div>
    </aside>

    <div id="table-view" class="table-container">

      <table id="spec-table">
        <colgroup>
          <col style="width: 12rem;">    <!-- 유닛 -->
          <col style="width: 6rem;">     <!-- 비용 -->
          <col style="width: 2.9rem;">   <!-- 인구 -->
          <col style="width: 3.8rem;">   <!-- 생산 시간 -->
          <col style="width: 6.64rem;">  <!-- 요구 조건 -->
          <col style="width: 4.62rem;">  <!-- 체력 -->
          <col style="width: 4.91rem;">  <!-- 에너지 -->
          <col style="width: 4.91rem;">  <!-- 방어력 -->
          <col style="width: 4.2rem;">   <!-- 시야 -->
          <col style="width: 6.06rem;">  <!-- 이동 속도 -->
          <col style="width: 11rem;">    <!-- 공격력 -->
          <col style="width: 3.75rem;">  <!-- 사거리 -->
          <col style="width: 5.48rem;">  <!-- 공격 주기 -->
          <col style="width: 5.20rem;">  <!-- DPS -->
          <col style="width: 10.10rem;"> <!-- 특성 -->
        </colgroup>
        <thead>
          <tr>
            <th data-col="default" class="text-center">유닛</th>
            <th data-col="minerals" class="text-center">비용</th>
            <th data-col="supply" class="text-center">인구</th>
            <th data-col="buildTime" class="text-center">생산 시간</th>
            <th class="text-center">요구 조건</th>
            <th data-col="hp" class="text-center">체력</th>
            <th data-col="energy" class="text-center">에너지</th>
            <th data-col="armor" class="text-center">방어력</th>
            <th data-col="sight" class="text-center">시야</th>
            <th data-col="speed" class="text-center">이동 속도</th>
            <th data-col="damage" class="text-center">공격력</th>
            <th data-col="range" class="text-center">사거리</th>
            <th data-col="cooldown" class="text-center">공격 주기</th>
            <th data-col="dps" class="text-center">DPS</th>
            <th>특성</th>
          </tr>
        </thead>
        <tbody id="unit-table-body"></tbody>
      </table>
    </div>

    <section id="compare-view" class="compare-view" aria-label="유닛 비교" hidden>
      <div class="compare-board">
        <article class="compare-unit-card compare-unit-left">
          <div class="compare-select-wrap">
            <input id="compare-left-select" class="compare-select" list="compare-unit-options" autocomplete="off" placeholder="유닛 검색">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
        </article>
        <div class="compare-top-controls" id="compare-top-controls">
          <div class="compare-ctrl-item compare-ctrl-atk" title="비교 대상 공격력 업그레이드">
            <span class="compare-ctrl-lbl">공격력</span>
            <select class="sel-sidebar-upg compare-ctrl-sel" id="sel-compare-atk-upg" onclick="event.stopPropagation();" onchange="setCompareAtkUpg(this.value)">
              <option value="0">0</option><option value="1">+1</option><option value="2">+2</option><option value="3">+3</option>
            </select>
          </div>
          <div class="compare-ctrl-divider"></div>
          <div class="compare-ctrl-item compare-ctrl-fullupg" onclick="toggleCompareFullUpgrade()" title="비교 대상 전체 풀 업그레이드 적용/해제">
            <span class="compare-ctrl-lbl">풀업</span>
            <button type="button" class="btn-stim-toggle btn-ability-toggle-lg" id="btn-compare-fullupg"><span class="toggle-knob"></span></button>
          </div>
          <div class="compare-ctrl-divider"></div>
          <div class="compare-ctrl-item compare-ctrl-armor" title="비교 대상 방어력 업그레이드">
            <span class="compare-ctrl-lbl">방어력</span>
            <select class="sel-sidebar-upg compare-ctrl-sel" id="sel-compare-armor-upg" onclick="event.stopPropagation();" onchange="setCompareArmorUpg(this.value)">
              <option value="0">0</option><option value="1">+1</option><option value="2">+2</option><option value="3">+3</option>
            </select>
          </div>
        </div>
        <article class="compare-unit-card compare-unit-right">
          <div class="compare-select-wrap">
            <input id="compare-right-select" class="compare-select" list="compare-unit-options" autocomplete="off" placeholder="유닛 검색">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
        </article>
        <div id="compare-modal-panels" class="compare-modal-panels"></div>
      </div>
      <datalist id="compare-unit-options"></datalist>
    </section>

    <!-- 패치 내역 뷰 -->
    <section id="patch-view" class="patch-view" aria-label="패치 내역" hidden>
      <div id="patch-content" class="patch-content"></div>
    </section>

  </main>

  <!-- 상세 정보 모달 -->
  <div id="detail-modal" class="modal-overlay">
    <div class="modal-content">
      <button id="close-modal" class="close-btn">&times;</button>

      <div class="modal-body">
        <!-- 상단: 초상화 + 이름 -->
        <div class="modal-top-section">
          <div id="modal-portrait-container" class="modal-portrait"></div>
          <div class="modal-meta">
            <div class="modal-title-row">
              <h2 id="modal-unit-name">유닛 이름</h2>
              <span id="modal-unit-eng" class="modal-meta-en">UNIT NAME</span>
            </div>
            <p id="modal-unit-desc" class="modal-description">유닛 설명</p>
          </div>
          <div id="modal-produced-from" class="modal-produced-from"></div>
        </div>

        <!-- 2단 레이아웃: 스펙표 (왼쪽) + 시뮬레이터 (오른쪽) -->
        <div class="modal-two-col">

          <!-- ◀ 왼쪽: 1열 스펙표 -->
          <div class="modal-spec-col">
              <table class="sol-table">
                <colgroup>
                  <col style="width: 24%;">
                  <col style="width: 26%;">
                  <col style="width: 24%;">
                  <col style="width: 26%;">
                </colgroup>
                <tbody>
                  <tr id="wiki-cost-row">
                    <td class="sol-label">비용</td>
                    <td class="sol-value" id="wiki-cost" colspan="3">-</td>
                  </tr>
                  <tr id="wiki-reqs-row">
                    <td class="sol-label">요구 조건</td>
                    <td class="sol-value" id="wiki-reqs" colspan="3">-</td>
                  </tr>
                  <tr id="wiki-hp-row">
                    <td class="sol-label" id="wiki-hp-l1">보호막</td>
                    <td class="sol-value" id="wiki-hp-v1">-</td>
                    <td class="sol-label" id="wiki-hp-l2">체력</td>
                    <td class="sol-value" id="wiki-hp-v2">-</td>
                  </tr>
                  <tr id="wiki-energy-row">
                    <td class="sol-label">에너지 (초기/최대)</td>
                    <td class="sol-value" id="wiki-energy" colspan="3">-</td>
                  </tr>
                  <tr id="wiki-armor-row">
                    <td class="sol-label" id="wiki-armor-l1">보호막 방어력</td>
                    <td class="sol-value" id="wiki-armor-v1">-</td>
                    <td class="sol-label" id="wiki-armor-l2">방어력</td>
                    <td class="sol-value" id="wiki-armor-v2">-</td>
                  </tr>
                  <tr id="wiki-sight-speed-row">
                    <td class="sol-label" id="wiki-sight-label">시야 (탐지)</td>
                    <td class="sol-value" id="wiki-sight">-</td>
                    <td class="sol-label" id="wiki-speed-label">이동 속도</td>
                    <td class="sol-value" id="wiki-speed">-</td>
                  </tr>
                  <tr id="wiki-transport-row" style="display: none;">
                    <td class="sol-label" id="wiki-transport-label">수송 한도</td>
                    <td class="sol-value" id="wiki-transport" colspan="3">8칸</td>
                  </tr>
                  <tr>
                    <td class="sol-label">특성</td>
                    <td class="sol-value" id="wiki-attributes" colspan="3">-</td>
                  </tr>
                </tbody>
              </table>

            <!-- 공격력 상세 테이블 (무기별) -->
            <h3 class="atk-title" id="wiki-atk-title" style="margin-top: 1.2rem; margin-bottom: 0.5rem; display: none;">무기 스펙</h3>
            <div id="wiki-atk-table">
              <!-- JS로 채움 -->
            </div>
            <h3 class="atk-title" id="wiki-research-title" style="margin-top: 1.2rem; margin-bottom: 0.5rem; display: none;">연구 가능 업그레이드</h3>
            <div id="wiki-research-container" style="display: none; border: 1px solid var(--panel-border); border-radius: 4px; padding: 0.75rem; background: rgba(0,0,0,0.2);">
              <!-- JS로 채움 -->
            </div>
              <h3 class="atk-title" id="modal-abilities-title" style="margin-top: 1.2rem; margin-bottom: 0.5rem; display: none;">능력</h3>
              <div id="modal-abilities-container" class="upgrades-section" style="display: none;"></div>

              <h3 class="atk-title" id="modal-unit-upgrades-title" style="margin-top: 1.2rem; margin-bottom: 0.5rem; display: none;">적용 가능 업그레이드</h3>
              <div id="modal-unit-upgrades-container" class="upgrades-section" style="display: none;"></div>

              <h3 class="atk-title" id="modal-upgrades-title" style="margin-top: 1.2rem; margin-bottom: 0.5rem; display: none;">연구 가능 업그레이드</h3>
              <div id="modal-upgrades-container" class="upgrades-section" style="margin-bottom: 1.5rem; display: none;"></div>
          </div>

        </div><!-- end modal-two-col -->
      </div><!-- end modal-body -->
    </div><!-- end modal-content -->
  </div>

  <script src="app.js"></script>
</body>
</html>
